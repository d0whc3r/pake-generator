name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: quality
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.detect.outputs.has }}
      matrix: ${{ steps.detect.outputs.matrix }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - name: git identity for the version bump commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Only main publishes: elsewhere (PRs, manual runs on branches) the
        # detection is a dry-run, so no seed tags nor bump commit are pushed.
        run: |
          if [ "${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}" = "true" ]; then
            pnpm pake release-detect --dry
          else
            pnpm pake release-detect
          fi

  release:
    name: release ${{ matrix.id }}
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check.outputs.has == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    env:
      # Out of node_modules (a pnpm symlink farm) so it can be cached, and
      # shared by every app: only the `pake` crate itself embeds the per-app
      # config, its ~344 dependencies compile identically for all of them.
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      # pake's release profile is tuned for binary size (codegen-units = 1,
      # lto = "thin"), and every app pays its whole-program link again: the
      # `pake` crate embeds the config, so its codegen and the LTO pass over
      # the whole graph never come from the cache. ~1 MB more binary buys a
      # 45% shorter per-app build.
      CARGO_PROFILE_RELEASE_LTO: false
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      # Bundle the .app directly instead of a .dmg the build would only mount
      # again to extract it: the release asset is the zip of the .app anyway.
      PAKE_CREATE_APP: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}
      - uses: ./.github/actions/setup
      - id: cargo
        # Keyed on the Rust dependency graph, not on pnpm-lock.yaml: a bump of
        # any JS devDependency must not throw away the compiled crates. The
        # profile overrides are part of the key because cache entries are
        # immutable: reusing a key would restore artifacts cargo then discards
        # as stale, and never store the new ones.
        run: echo "key=$(shasum -a 256 node_modules/pake-cli/src-tauri/Cargo.lock | cut -c1-16)-lto$CARGO_PROFILE_RELEASE_LTO-cgu$CARGO_PROFILE_RELEASE_CODEGEN_UNITS" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ env.CARGO_TARGET_DIR }}
          key: cargo-${{ runner.os }}-${{ steps.cargo.outputs.key }}
          restore-keys: cargo-${{ runner.os }}-
      - name: drop bundles left in the cached target dir
        # They belong to whichever app populated the cache; leaving them around
        # risks publishing a stale .app if a later build stops short.
        run: rm -rf "$CARGO_TARGET_DIR"/*/release/bundle "$CARGO_TARGET_DIR"/release/bundle
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm pake release-app ${{ matrix.id }}
